# HA RabbitMQ cluster for Docker Swarm - backs the tailer ingestion pipeline
# (reader -> RabbitMQ -> workers).
#
# OPTIONAL, additive stack for multi-node deployments. Deploy alongside
# docker-stack.redis.yml before docker-stack.app.yml. Not needed at all for
# the single-server docker-compose.yml path.
#
# Uses three RabbitMQ nodes (rabbitmq1/2/3) clustered with shared Erlang
# cookie. Messages are non-durable (durable: false) - the tailer reader
# persists its file position to Redis, so a RabbitMQ restart just means
# draining the in-memory queue and resuming from the saved position.
#
# Prerequisites (see README "High Availability Deployment"):
#   - Docker Swarm initialized, 3 nodes labeled rabbitmq_id=1 / rabbitmq_id=2 /
#     rabbitmq_id=3 (can be the same nodes as cache_id=*, pg_id=*, or
#     app=true/edge=true on small clusters)
#   - `docker network create -d overlay --attachable syslog_net` (already
#     done if docker-stack.postgres.yml is deployed)
#   - docker-stack.vault.yml already deployed and bootstrapped - rabbitmq_password
#     is supplied by vault-agent's bind-mounted output, not a native Swarm
#     secret (see the rabbitmq-password-mount anchor below)
#   - Secret created: rabbitmq_erlang_cookie (stays a native Swarm secret -
#     rotating it requires a full cluster re-init, so it's excluded from the
#     Vault cutover, see scripts/rotate-secrets.sh)
#
# Deploy with: ./scripts/swarm-deploy.sh rabbitmq (not a bare
# `docker stack deploy` - see "content-hash name" note on the configs:
# section below for why)

version: "3.8"

x-rabbitmq-logging: &rabbitmq-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Vault cutover: same /run/secrets/rabbitmq_password path entrypoint.sh /
# join_entrypoint.sh already read, now a bind-mounted file written by
# vault-agent (docker-stack.vault.yml) instead of a native Swarm secret.
x-rabbitmq-password-mount: &rabbitmq-password-mount
  - type: bind
    source: /srv/syslog-ha/vault-secrets/rabbitmq_password
    target: /run/secrets/rabbitmq_password
    read_only: true

services:
  rabbitmq1:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq1
    networks: [syslog_net]
    environment:
      RABBITMQ_ERLANG_COOKIE_FILE: /run/secrets/rabbitmq_erlang_cookie
    entrypoint: ["/docker-entrypoint-init.d/entrypoint.sh"]
    configs:
      - source: rabbitmq_conf_tpl
        target: /etc/rabbitmq/rabbitmq.conf.tpl
      - source: rabbitmq_entrypoint
        target: /docker-entrypoint-init.d/entrypoint.sh
        mode: 0755
    secrets:
      - rabbitmq_erlang_cookie
    volumes: *rabbitmq-password-mount
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging: *rabbitmq-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.labels.rabbitmq_id == 1]

  rabbitmq2:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq2
    networks: [syslog_net]
    environment:
      RABBITMQ_ERLANG_COOKIE_FILE: /run/secrets/rabbitmq_erlang_cookie
    entrypoint: ["/docker-entrypoint-init.d/join_entrypoint.sh"]
    configs:
      - source: rabbitmq_conf_tpl
        target: /etc/rabbitmq/rabbitmq.conf.tpl
      - source: rabbitmq_join_entrypoint
        target: /docker-entrypoint-init.d/join_entrypoint.sh
        mode: 0755
    secrets:
      - rabbitmq_erlang_cookie
    volumes: *rabbitmq-password-mount
    depends_on: [rabbitmq1]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *rabbitmq-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.labels.rabbitmq_id == 2]

  rabbitmq3:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq3
    networks: [syslog_net]
    environment:
      RABBITMQ_ERLANG_COOKIE_FILE: /run/secrets/rabbitmq_erlang_cookie
    entrypoint: ["/docker-entrypoint-init.d/join_entrypoint.sh"]
    configs:
      - source: rabbitmq_conf_tpl
        target: /etc/rabbitmq/rabbitmq.conf.tpl
      - source: rabbitmq_join_entrypoint
        target: /docker-entrypoint-init.d/join_entrypoint.sh
        mode: 0755
    secrets:
      - rabbitmq_erlang_cookie
    volumes: *rabbitmq-password-mount
    depends_on: [rabbitmq1]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging: *rabbitmq-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.labels.rabbitmq_id == 3]

  # Simple TCP load balancer fronting the RabbitMQ cluster. api connects
  # to this VIP instead of a single node, so it survives node failures.
  haproxy-rabbitmq:
    image: haproxy:2.9-alpine
    networks: [syslog_net]
    configs:
      - source: haproxy_rabbitmq_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
    ports:
      - target: 5672
        published: 5672
        protocol: tcp
        mode: host
      - target: 15672
        published: 15672
        protocol: tcp
        mode: host
    depends_on: [rabbitmq1, rabbitmq2, rabbitmq3]
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *rabbitmq-logging
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.labels.app == true]

networks:
  syslog_net:
    external: true

secrets:
  rabbitmq_erlang_cookie:
    external: true

# The three file:-based configs below get a content-hash name (computed by
# scripts/swarm-deploy.sh) because Swarm configs are immutable even when
# not `external: true` - see docker-stack.monitoring.yml's configs: header
# for the full explanation.
configs:
  haproxy_rabbitmq_cfg:
    external: true
  rabbitmq_conf_tpl:
    file: rabbitmq/rabbitmq.conf.tpl
    name: rabbitmq_conf_tpl_${RABBITMQ_CONF_TPL_HASH:-unset}
  rabbitmq_entrypoint:
    file: rabbitmq/entrypoint.sh
    name: rabbitmq_entrypoint_${RABBITMQ_ENTRYPOINT_HASH:-unset}
  rabbitmq_join_entrypoint:
    file: rabbitmq/join_entrypoint.sh
    name: rabbitmq_join_entrypoint_${RABBITMQ_JOIN_ENTRYPOINT_HASH:-unset}
