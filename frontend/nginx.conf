# Defines $cors_allow_origin from the browser's Origin header, matched
# against the allowed origins configured under admin Settings. Written to
# /data/nginx/cors.conf by the backend (see handler.reloadNginx) whenever
# the cors_origins setting changes; entrypoint.sh seeds a default-deny map
# so nginx has a valid definition before the backend's first sync.
include /data/nginx/cors.conf;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for frontend static content
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # haproxy-app's frontend_http listener (haproxy/haproxy-app.cfg) polls
    # this with "option httpchk GET /healthz" / "http-check expect status
    # 200". redirect.conf (below) explicitly exempts this path so the check
    # keeps getting a plain 200 even with https_redirect on - otherwise every
    # frontend replica would 301 the probe, haproxy would mark them all DOWN,
    # and :80 would answer real clients with 503 instead of ever redirecting
    # them to :443.
    location = /healthz {
        return 200 "ok\n";
    }

    include /data/nginx/redirect.conf;

    # Vite hashes filenames into content-based hashes, so the hashed assets
    # in /assets/ can be cached aggressively - a new build produces a new
    # filename, which bypasses the old cached copy automatically.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static files (icons, locales, favicon, etc.) don't have content hashes
    # in their filenames but change rarely - cache for 1 day to avoid
    # re-downloading on every page load without risking stale content for
    # long periods.
    location ~* ^/(icons/|locales/|favicon\.png|sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # index.html must never be cached — it references hashed asset filenames.
    # If a stale copy of index.html is served, the browser will request
    # assets with old hashes (e.g. Admin-SnRLm7qt.js) that no longer exist,
    # causing a "Failed to fetch dynamically imported module" error.
    # no-cache forces revalidation on every load; Vary lets the CDN/proxy
    # cache separate copies for gzip/brotli without interfering.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept-Encoding" always;
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's stock mime.types has no entry for .webmanifest, so without
    # this it falls back to application/octet-stream - some browsers are
    # lenient about that for the manifest fetch, but this keeps prod
    # matching what `vite dev` already serves it as.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Must never be cached, or the browser keeps running a stale worker
    # (stale alert-push handling, stale app-shell fallback) until a hard
    # refresh - no-cache still lets the browser use its own copy after a
    # 304, it just forces a revalidation request every time.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # SSE streaming endpoint
    location /api/notifications/stream {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-CSRF-Token" always;
        # $API_UPSTREAM is substituted by entrypoint.sh at container start
        # (envsubst, restricted to just this variable so nginx's own $-vars
        # below are left untouched). Defaults to api:8080 (plain docker-
        # compose.yml, single api instance); docker-stack.app.yml overrides
        # it to haproxy-app:8090, haproxy-app's api_http listener (see
        # haproxy/haproxy-app.cfg) - health-checked load balancing across
        # every api task instead of Swarm's opaque VIP round-robin.
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_http_version 1.1;
    }

    # Log cleanup ("Cleanup old logs") and purge-all ("Delete all logs") can
    # run for minutes on a large syslog_logs table (batched DELETE / TRUNCATE
    # queued behind a long-running transaction) - the backend already lifts
    # its own write deadline for these two (see handler.CleanupLogs /
    # handler.PurgeAllLogs) and api.ts raises axios's timeout to 600s for
    # them (admins have seen purge take close to 5 minutes on large tables),
    # but nginx's default 60s proxy_read_timeout would still kill the
    # upstream connection out from under both of those. Match the 600s
    # frontend timeout here so the request can actually finish.
    location = /api/admin/settings/cleanup {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-CSRF-Token" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api/admin/logs {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-CSRF-Token" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Secret rotation triggers Vault writes, DB re-encryption of all secrets,
    # and dynamic credential rotation (PG + RabbitMQ) - the handler blocks
    # up to 300s waiting for all 4 secrets to complete. Match the backend
    # timeout so nginx doesn't kill the connection at its default 60s.
    location = /api/admin/rotation/trigger {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-CSRF-Token" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Reverse proxy to API
    location /api/ {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-CSRF-Token" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        # $API_UPSTREAM is substituted by entrypoint.sh at container start
        # (envsubst, restricted to just this variable so nginx's own $-vars
        # below are left untouched). Defaults to api:8080 (plain docker-
        # compose.yml, single api instance); docker-stack.app.yml overrides
        # it to haproxy-app:8090, haproxy-app's api_http listener (see
        # haproxy/haproxy-app.cfg) - health-checked load balancing across
        # every api task instead of Swarm's opaque VIP round-robin.
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend caps filtered queries (dashboard data/count, log list/
        # count) at 60s plus a 5s write-deadline margin (see
        # backend/handler/querybuilder.go filteredQueryTimeout); on a slow
        # disk a 30-day scan under MV-refresh/ingest I/O contention can
        # approach that, and nginx's default 60s proxy_read_timeout would cut
        # the response mid-flight. Allow headroom over the backend ceiling.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# The HTTPS (443) server block is not defined here - it's disabled by
# default. It's written to /data/nginx/https.conf by the backend
# (see handler.reloadNginx) whenever https_enabled is turned on, and left
# empty otherwise. entrypoint.sh seeds an empty file so a fresh container
# never serves HTTPS until it's explicitly enabled.
include /data/nginx/https.conf;
