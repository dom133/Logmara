# Defines $cors_allow_origin from the browser's Origin header, matched
# against the allowed origins configured under admin Settings. Written to
# /data/nginx/cors.conf by the backend (see handler.reloadNginx) whenever
# the cors_origins setting changes; entrypoint.sh seeds a default-deny map
# so nginx has a valid definition before the backend's first sync.
include /data/nginx/cors.conf;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    include /data/nginx/redirect.conf;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's stock mime.types has no entry for .webmanifest, so without
    # this it falls back to application/octet-stream - some browsers are
    # lenient about that for the manifest fetch, but this keeps prod
    # matching what `vite dev` already serves it as.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Must never be cached, or the browser keeps running a stale worker
    # (stale alert-push handling, stale app-shell fallback) until a hard
    # refresh - no-cache still lets the browser use its own copy after a
    # 304, it just forces a revalidation request every time.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # SSE streaming endpoint
    location /api/notifications/stream {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-CSRF-Token" always;
        # $API_UPSTREAM is substituted by entrypoint.sh at container start
        # (envsubst, restricted to just this variable so nginx's own $-vars
        # below are left untouched). Defaults to api:8080 (plain docker-
        # compose.yml, single api instance); docker-stack.app.yml overrides
        # it to haproxy-app:8090, haproxy-app's api_http listener (see
        # haproxy/haproxy-app.cfg) - health-checked load balancing across
        # every api task instead of Swarm's opaque VIP round-robin.
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_http_version 1.1;
    }

    # Log cleanup ("Cleanup old logs") and purge-all ("Delete all logs") can
    # run for minutes on a large syslog_logs table (batched DELETE / TRUNCATE
    # queued behind a long-running transaction) - the backend already lifts
    # its own write deadline for these two (see handler.CleanupLogs /
    # handler.PurgeAllLogs) and api.ts raises axios's timeout to 600s for
    # them (admins have seen purge take close to 5 minutes on large tables),
    # but nginx's default 60s proxy_read_timeout would still kill the
    # upstream connection out from under both of those. Match the 600s
    # frontend timeout here so the request can actually finish.
    location = /api/admin/settings/cleanup {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-CSRF-Token" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api/admin/logs {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-CSRF-Token" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Reverse proxy to API
    location /api/ {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Cookie, X-CSRF-Token" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        # $API_UPSTREAM is substituted by entrypoint.sh at container start
        # (envsubst, restricted to just this variable so nginx's own $-vars
        # below are left untouched). Defaults to api:8080 (plain docker-
        # compose.yml, single api instance); docker-stack.app.yml overrides
        # it to haproxy-app:8090, haproxy-app's api_http listener (see
        # haproxy/haproxy-app.cfg) - health-checked load balancing across
        # every api task instead of Swarm's opaque VIP round-robin.
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# The HTTPS (443) server block is not defined here - it's disabled by
# default. It's written to /data/nginx/https.conf by the backend
# (see handler.reloadNginx) whenever https_enabled is turned on, and left
# empty otherwise. entrypoint.sh seeds an empty file so a fresh container
# never serves HTTPS until it's explicitly enabled.
include /data/nginx/https.conf;
