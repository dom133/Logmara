global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:7001']
        labels:
          group: 'app'
      - targets: ['haproxy:7001']
        labels:
          group: 'postgres'
      - targets: ['haproxy-rabbitmq:7001']
        labels:
          group: 'rabbitmq'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres1:9187', 'postgres2:9187', 'postgres3:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis1:9121', 'redis2:9121', 'redis3:9121']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq1:15692', 'rabbitmq2:15692', 'rabbitmq3:15692']

  - job_name: 'api-metrics'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8080']

  - job_name: 'patroni'
    static_configs:
      - targets: ['postgres1:8008', 'postgres2:8008', 'postgres3:8008']
