# HA application tier (api, rsyslog, frontend, haproxy-app) for Docker Swarm.
#
# OPTIONAL, additive stack for multi-node deployments — does not replace or
# modify docker-compose.yml (the supported single-server path, see README
# "Quick Start"). Deploy alongside docker-stack.postgres.yml.
#
# Swarm `docker stack deploy` does NOT build images (no `build:` support),
# so images must be built and pushed to a registry every node can pull from
# first:
#   docker build -f Dockerfile.backend  -t ${REGISTRY:?}/logmara-api:${TAG:-latest} .
#   docker build -f Dockerfile.rsyslog  -t ${REGISTRY:?}/logmara-rsyslog:${TAG:-latest} .
#   docker build -f Dockerfile.frontend -t ${REGISTRY:?}/logmara-frontend:${TAG:-latest} .
#   docker push ${REGISTRY:?}/logmara-api:${TAG:-latest}   (repeat for the other two)
#
# `api` and `frontend` run 2 replicas each (see API_REPLICAS/FRONTEND_
# REPLICAS below to change that). This requires docker-stack.redis.yml to
# already be deployed: it's what makes running >1 replica safe (Redis-backed
# rate limiting/cache invalidation/tailer leader election/ingestion control
# in backend/sharedstate, replacing what used to be in-memory, single-
# process-only state - see backend/control/ingestion.go, backend/tailer/
# tailer.go, backend/handler/stats.go+logs.go+slow_query_logger.go). Without
# REDIS_SENTINEL_ADDRS set, all of that transparently falls back to the
# original single-process behavior instead - safe, but only correct at
# replicas: 1.
#
# `frontend` is not published on the host anymore - `haproxy-app` (below) is
# what actually binds :80/:443 on every edge=true node and load-balances
# across every frontend/api replica cluster-wide via tasks.frontend/tasks.api.
# This is what makes multiple replicas an actual load-balancing win behind
# the keepalived VIP, not just a failover target (only one node's published
# ports were ever reachable through the VIP before). :8080 (the API) is
# never published directly - all traffic goes through nginx on :80/:443.
#
# `rsyslog` uses `mode: global` on role==edge nodes with `mode: host` port
# publishing instead: this bypasses the Swarm ingress routing mesh, which
# otherwise SNATs UDP/TCP syslog traffic and would break the app's
# fromhost_ip-based parser matching (rsyslog needs the real sender IP). Only
# the edge node currently holding the keepalived VIP (see keepalived/)
# actually receives traffic, so despite N containers running there is still
# only one active writer to logs.jsonl at a time - it is not affected by the
# api/frontend replica count above.
#
# Prerequisites (see README "High Availability Deployment"):
#   - docker-stack.postgres.yml already deployed (provides haproxy:5000)
#   - docker-stack.redis.yml already deployed (provides sentinel1/2/3:26379)
#   - Nodes labeled app=true (api/frontend) and edge=true (rsyslog,
#     haproxy-app, keepalived). These are independent boolean labels (not a
#     single "role" value), so a small cluster can freely put both on the
#     same nodes - haproxy-app needs edge=true specifically, since it must
#     colocate with whichever node currently holds the keepalived VIP.
#   - haproxy_app_cfg Swarm config created (`scripts/swarm-bootstrap.sh
#     haproxy-app-config`)
#   - NFS export mounted at the same path on every app=true / edge=true node,
#     e.g. /mnt/syslog-nfs, exporting what were log_data/log_spool
#   - jwt_secret and encryption_key secrets created (`scripts/swarm-
#     bootstrap.sh app-secrets <jwt> <enc>`); pg_app_password and
#     redis_password already exist from the two prerequisite stacks above
#     and are reused here as-is - all four are mounted into the api service
#     and read via the *_FILE env var convention (see util.SecretFromEnv),
#     never as plain env vars. POSTGRES_USER/POSTGRES_DB below are optional
#     (default syslog/syslog_db) and are not secret.
#
# Deploy with: docker stack deploy -c docker-stack.app.yml logmara-app

version: "3.8"

# Note: unlike `docker compose up`, Swarm's `docker stack deploy` does not
# honor `depends_on` health-gated ordering (docker-compose.yml uses
# `depends_on.condition: service_healthy` for this) — all services start in
# parallel and rely on their own retry/backoff (e.g. the API's DB connection
# retry, rsyslog's independent startup) to come up cleanly regardless of
# start order. `depends_on` below is kept only for documentation/DNS-resolve
# ordering, not as a readiness gate.

services:
  # Read-only, allow-listed view onto the Docker Engine API, used by
  # Admin > Health (backend/handler/health_docker.go) to show container /
  # Swarm service status. Placed on manager nodes only (node.role ==
  # manager) - unlike a single-host /containers/json call, Swarm's
  # /services and /tasks endpoints return the *entire* cluster's state from
  # any one manager, including nodes that never run api itself (the
  # Postgres/Redis managers) - so this, unlike mounting the socket into api
  # directly on app=true workers, is what actually gives full cluster
  # visibility. api reaches it through the docker-proxy service DNS name,
  # which load-balances across every manager replica. Not published - only
  # reachable from other syslog_net containers. See the matching comment in
  # docker-compose.yml for why this proxy exists instead of a raw socket
  # mount on api.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NODES: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - syslog_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      mode: global
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  rsyslog:
    image: ${REGISTRY:?set REGISTRY to your image registry}/logmara-rsyslog:${TAG:-latest}
    environment:
      - TZ=UTC
    volumes:
      - log_data:/data
      - log_spool:/spool
    ports:
      - target: 514
        published: 514
        protocol: tcp
        mode: host
      - target: 514
        published: 514
        protocol: udp
        mode: host
      # Direct TLS ingestion, no client certificate required - see the
      # matching comment in docker-compose.yml.
      - target: 6514
        published: 6514
        protocol: tcp
        mode: host
      # mTLS listener for remote syslog relays (Admin > Settings > enable
      # relay ingestion). Safe to leave published even when unused - see the
      # matching comment in docker-compose.yml.
      - target: 6515
        published: 6515
        protocol: tcp
        mode: host
    networks:
      - syslog_net
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "pgrep", "-x", "rsyslogd"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      mode: global
      placement:
        constraints: [node.labels.edge == true]
      restart_policy:
        condition: on-failure

  api:
    image: ${REGISTRY:?set REGISTRY to your image registry}/logmara-api:${TAG:-latest}
    # Must be >= main.go's srv.Shutdown() context timeout (30s). Without this,
    # Docker's default 10s stop_grace_period SIGKILLs the container while it's
    # still draining in-flight requests (on `docker service update`'s
    # stop-first rollout, or a task being rescheduled after a node failure) -
    # any response whose body hadn't finished writing yet arrives at nginx/the
    # browser truncated mid-stream, which surfaces as a JSON parse error on
    # whatever request was unlucky enough to be in flight at that moment.
    stop_grace_period: 35s
    environment:
      TZ: UTC
      # Every credential below is mounted as a Docker Swarm secret (see the
      # `secrets:` list below and the top-level `secrets:` section) rather
      # than passed as a plain env var - none of them appear in `docker
      # service inspect`, /proc, or crash dumps this way. util.SecretFromEnv
      # reads the *_FILE-suffixed path when the plain var is unset. Create
      # them with `scripts/swarm-bootstrap.sh app-secrets` (jwt_secret,
      # encryption_key) - pg_app_password and redis_password are the same
      # secrets already created for docker-stack.postgres.yml/redis.yml
      # (see prerequisites comment above), reused here rather than
      # duplicated as separate plain env vars.
      POSTGRES_HOST: haproxy
      POSTGRES_PORT: "5000"
      POSTGRES_USER: ${POSTGRES_USER:-syslog}
      POSTGRES_DB: ${POSTGRES_DB:-syslog_db}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_app_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      # Never stored in the database - a DB dump alone must not be able to
      # decrypt stored SMTP/LDAP credentials. See README "Security keys".
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      PORT: "8080"
      LOG_FILE_PATH: /data/logs.jsonl
      # tasks.frontend (not plain "frontend") resolves to every frontend
      # replica's task IP, not just one behind the Swarm VIP - see
      # backend/handler/admin.go's postReloadRequests.
      NGINX_RELOAD_TARGETS_HOST: tasks.frontend
      NGINX_RELOAD_PORT: "8081"
      NGINX_CONF_DIR: /data/nginx
      HTTPS_ENABLED: ${HTTPS_ENABLED:-}
      HTTPS_REDIRECT: ${HTTPS_REDIRECT:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # rsyslog runs `mode: global` across every edge=true node (see the
      # comment above), so a relay ACL/whitelist change must reload all of
      # them, not just whichever one currently holds the keepalived VIP -
      # same reasoning as tasks.frontend for nginx above.
      RSYSLOG_RELOAD_TARGETS_HOST: tasks.rsyslog
      RSYSLOG_RELOAD_PORT: "8082"
      RELAY_CENTRAL_HOST: ${RELAY_CENTRAL_HOST:-}
      # Backs Admin > Health - see the docker-proxy service above.
      DOCKER_PROXY_URL: http://docker-proxy:2375
      REDIS_SENTINEL_ADDRS: sentinel1:26379,sentinel2:26379,sentinel3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      # Mirrors deploy.replicas below so main.go can refuse to start rather
      # than silently run uncoordinated tailers if this stack is ever
      # deployed with API_REPLICAS > 1 but without docker-stack.redis.yml.
      API_REPLICAS: ${API_REPLICAS:-2}
      # Directory the builtin parser JSON definitions (backend/db/parsers)
      # are bootstrapped into and re-read from on every start, so an
      # operator can edit/add/remove them without rebuilding the image. Must
      # be shared storage (NFS, like log_data below) since API_REPLICAS can
      # run on different nodes and all of them need to see the same edits.
      PARSER_DEFS_DIR: /parsers
    secrets:
      - jwt_secret
      - encryption_key
      - pg_app_password
      - redis_password
    volumes:
      - log_data:/data
      - parser_defs:/parsers
    networks:
      - syslog_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: ${API_REPLICAS:-2}
      placement:
        constraints: [node.labels.app == true]
      restart_policy:
        condition: any
        delay: 5s
      # stop-first (not start-first): each replica's tailer only guards
      # against concurrent ingestion via Redis leader election, which still
      # needs its lock's TTL to lapse before a new task can take over (see
      # main.go's LeaderElector comment) - starting the new task before the
      # old one has fully stopped means both briefly exist, and the update
      # only really has to wait as long as the old task takes to shut down
      # (well under the lock TTL). Trading a brief gap in serving traffic
      # during rollout for one less thing that has to line up perfectly.
      update_config:
        order: stop-first
        parallelism: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    image: ${REGISTRY:?set REGISTRY to your image registry}/logmara-frontend:${TAG:-latest}
    environment:
      # Routes /api/ through haproxy-app's api_http listener instead of
      # nginx.conf's plain-docker-compose default (api:8080 directly) - see
      # haproxy/haproxy-app.cfg for the health-checked load balancing this
      # buys across every api task.
      API_UPSTREAM: http://haproxy-app:8090
    volumes:
      - log_data:/data
    networks:
      - syslog_net
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: ${FRONTEND_REPLICAS:-2}
      placement:
        constraints: [node.labels.app == true]
      restart_policy:
        condition: any
        delay: 5s
      # stop-first, matching api above: old replica fully stops before the
      # new one starts, so an update never runs old and new versions side by
      # side even briefly.
      update_config:
        order: stop-first
        parallelism: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Fronts frontend/api with real load balancing across every replica
  # cluster-wide (via tasks.frontend/tasks.api - see haproxy/haproxy-app.cfg),
  # behind the keepalived VIP. mode: global + edge==true mirrors rsyslog: one
  # instance per edge node, but only the node currently holding the VIP
  # actually receives external traffic - unlike rsyslog, that one instance
  # then load-balances across the *entire* frontend/api replica set, not
  # just itself, which is what makes replicas > 1 an actual scale-out win
  # for HTTP traffic instead of only a failover target.
  haproxy-app:
    image: haproxy:2.9-alpine
    environment:
      # haproxy-app.cfg's server-template lines reference these directly
      # (HAProxy expands ${VAR} in its own config file from the process
      # environment) - keeps the frontend_http/frontend_https/api_http pool
      # sizes in lockstep with the actual replica counts below without
      # having to hand-edit haproxy-app.cfg whenever those change.
      FRONTEND_REPLICAS: ${FRONTEND_REPLICAS:-2}
      API_REPLICAS: ${API_REPLICAS:-2}
    configs:
      - source: haproxy_app_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
    ports:
      - target: 80
        published: ${FRONTEND_PORT:-80}
        mode: host
      - target: 443
        published: ${FRONTEND_HTTPS_PORT:-443}
        mode: host
      # Stats page (haproxy/haproxy-app.cfg's `listen stats`) - published
      # per-node via mode: host, same as 80/443, so http://<node-ip>:7001/
      # shows that specific node's view (which frontend-*/api-* slots it
      # sees as UP). No `stats auth` is set, so anyone who can reach this
      # port sees internal service topology (task names/IPs) - firewall
      # ${HAPROXY_APP_STATS_PORT:-7001} to trusted/admin source IPs only if
      # the edge nodes are reachable from anywhere untrusted.
      - target: 7001
        published: ${HAPROXY_APP_STATS_PORT:-7001}
        mode: host
    networks:
      - syslog_net
    depends_on:
      - frontend
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      mode: global
      placement:
        constraints: [node.labels.edge == true]
      restart_policy:
        condition: on-failure

networks:
  syslog_net:
    external: true

volumes:
  log_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER:?set NFS_SERVER to your NFS host},rw,nfsvers=4
      device: ":${NFS_LOG_DATA_PATH:-/srv/syslog-ha/nfs/log_data}"
  log_spool:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER:?set NFS_SERVER to your NFS host},rw,nfsvers=4
      device: ":${NFS_LOG_SPOOL_PATH:-/srv/syslog-ha/nfs/log_spool}"
  parser_defs:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER:?set NFS_SERVER to your NFS host},rw,nfsvers=4
      device: ":${NFS_PARSER_DEFS_PATH:-/srv/syslog-ha/nfs/parser_defs}"

secrets:
  # Created via `scripts/swarm-bootstrap.sh app-secrets <jwt> <enc>`.
  jwt_secret:
    external: true
  encryption_key:
    external: true
  # Same secrets already created for docker-stack.postgres.yml/redis.yml
  # (see prerequisites comment above) - reused here, not recreated.
  pg_app_password:
    external: true
  redis_password:
    external: true

configs:
  # Created via `scripts/swarm-bootstrap.sh haproxy-app-config`.
  haproxy_app_cfg:
    external: true
