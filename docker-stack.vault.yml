# HashiCorp Vault HA stack for Docker Swarm.
#
# Provides a 3-node Vault cluster with Raft storage and Vault agent
# sidecars for secret injection. Manual Shamir unseal (no cloud KMS).
#
# Architecture:
#   - 3 Vault servers (vault-1, vault-2, vault-3) on dedicated nodes
#   - Vault agent (mode: global) reads from Vault, writes to local files
#   - App services bind-mount agent output as :ro, *_FILE env vars point there
#   - Zero Go code changes required - uses existing *_FILE convention
#
# Prerequisites:
#   - Docker Swarm initialized
#   - `syslog_net` overlay network already exists
#   - Nodes labeled vault_id=1, vault_id=2, vault_id=3
#
# Deploy with: docker stack deploy -c docker-stack.vault.yml logmara-vault
# Bootstrap with: ./scripts/vault-bootstrap.sh init

version: "3.8"

services:
  vault-1:
    image: vault:1.15.0
    command: server -config=/vault/config/vault.hcl
    hostname: vault-1
    environment:
      VAULT_CLUSTER_ADDR: http://vault-1:8201
      VAULT_ADDR: http://vault-1:8200
    configs:
      - source: vault_cfg
        target: /vault/config/vault.hcl
    volumes:
      - vault1_data:/vault/data
      - vault1_tls:/vault/tls
    networks:
      - syslog_net
    ports:
      - target: 8200
        published: ${VAULT_UI_PORT:-8200}
        mode: host
    deploy:
      placement:
        constraints: [node.labels.vault_id == "1"]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vault-2:
    image: vault:1.15.0
    command: server -config=/vault/config/vault.hcl
    hostname: vault-2
    environment:
      VAULT_CLUSTER_ADDR: http://vault-2:8201
      VAULT_ADDR: http://vault-2:8200
    configs:
      - source: vault_cfg
        target: /vault/config/vault.hcl
    volumes:
      - vault2_data:/vault/data
      - vault2_tls:/vault/tls
    networks:
      - syslog_net
    deploy:
      placement:
        constraints: [node.labels.vault_id == "2"]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vault-3:
    image: vault:1.15.0
    command: server -config=/vault/config/vault.hcl
    hostname: vault-3
    environment:
      VAULT_CLUSTER_ADDR: http://vault-3:8201
      VAULT_ADDR: http://vault-3:8200
    configs:
      - source: vault_cfg
        target: /vault/config/vault.hcl
    volumes:
      - vault3_data:/vault/data
      - vault3_tls:/vault/tls
    networks:
      - syslog_net
    deploy:
      placement:
        constraints: [node.labels.vault_id == "3"]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Vault agent runs on every node, reads secrets from Vault, writes to
  # local files. App services bind-mount this directory read-only.
  vault-agent:
    image: vault:1.15.0
    command: agent -config=/vault-agent/config/vault-agent.hcl
    configs:
      - source: vault_agent_cfg
        target: /vault-agent/config/vault-agent.hcl
    volumes:
      - type: bind
        source: /srv/syslog-ha/vault-secrets
        target: /vault-agent/secrets
      - /vault-agent/token:/vault-agent/token
    networks:
      - syslog_net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  syslog_net:
    external: true

volumes:
  vault1_data:
  vault1_tls:
  vault2_data:
  vault2_tls:
  vault3_data:
  vault3_tls:

configs:
  vault_cfg:
    file: vault/vault.hcl
  vault_agent_cfg:
    file: vault/vault-agent.hcl
