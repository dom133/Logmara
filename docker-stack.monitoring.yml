# HA monitoring stack for Docker Swarm: Prometheus + Alertmanager + node_exporter + cadvisor.
#
# OPTIONAL, additive stack for multi-node deployments. Deploy alongside other
# stacks. Grafana is optional (set MONITORING_EXPOSE_GRAFANA=false to skip) -
# useful if you already have an existing Grafana instance.
#
# Prerequisites:
#   - Docker Swarm initialized
#   - `syslog_net` overlay network already exists
#   - Nodes labeled app=true and edge=true
#   - Grafana dashboards copied to /srv/syslog-ha/monitoring/grafana-dashboards/
#     on edge nodes (copy from monitoring/grafana-dashboards/ in repo)
#
# Deploy with: docker stack deploy -c docker-stack.monitoring.yml logmara-monitoring

version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    configs:
      - source: prometheus_cfg
        target: /etc/prometheus/prometheus.yml
      - source: alertmanager_cfg
        target: /etc/prometheus/alertmanager.yml
    volumes:
      - monitoring_data:/prometheus
    ports:
      - target: 9090
        published: ${MONITORING_PROMETHEUS_PORT:-9090}
        mode: host
    networks:
      - syslog_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.app == true]
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
      update_config:
        order: stop-first
        parallelism: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.26.0
    configs:
      - source: alertmanager_cfg
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - monitoring_alertmanager_data:/alertmanager
    ports:
      - target: 9093
        published: ${MONITORING_ALERTMANAGER_PORT:-9093}
        mode: host
    networks:
      - syslog_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.app == true]
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      update_config:
        order: stop-first
        parallelism: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.7.0
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    ports:
      - target: 9100
        published: 9100
        mode: host
    networks:
      - syslog_net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    command:
      - '--docker_only'
      - '--housekeeping_interval=10s'
    volumes:
      - /:/rootfs:ro,rslave
      - /var/run:/var/run:ro,rslave
      - /sys:/sys:ro,rslave
      - /var/lib/docker/:/var/lib/docker:ro,rslave
    ports:
      - target: 8080
        published: 8080
        mode: host
    networks:
      - syslog_net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
        mode: 0440
      - source: grafana_dashboards_cfg
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
        mode: 0440
    volumes:
      - monitoring_grafana_data:/var/lib/grafana
      - type: bind
        source: /srv/syslog-ha/monitoring/grafana-dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
    ports:
      - target: 3000
        published: ${MONITORING_GRAFANA_PORT:-3000}
        mode: host
    networks:
      - syslog_net
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.edge == true]
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      update_config:
        order: stop-first
        parallelism: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  syslog_net:
    external: true

volumes:
  monitoring_data:
  monitoring_alertmanager_data:
  monitoring_grafana_data:

configs:
  prometheus_cfg:
    file: monitoring/prometheus.yml
  alertmanager_cfg:
    file: monitoring/alertmanager.yml
  grafana_datasources:
    file: monitoring/grafana-datasources.yml
  grafana_dashboards_cfg:
    file: monitoring/grafana-dashboards.yml
