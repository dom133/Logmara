# Syslog receiver configuration
# High-throughput: write JSON lines to shared file

# Load input modules
$ModLoad imtcp
$ModLoad imudp

# Enable TCP and UDP listeners
$InputTCPServerRun 514
$UDPServerRun 514

# JSON template with proper escaping
template(name="JsonLines" type="list") {
  constant(value="{")
  constant(value="\"@timestamp\":\"")
  property(name="timereported" dateFormat="rfc3339" format="jsonf")
  constant(value="\",\"hostname\":\"")
  property(name="fromhost-ip" format="jsonf")
  constant(value="\",\"severity_text\":\"")
  property(name="syslogseverity-text" format="jsonf")
  constant(value="\",\"facility_text\":\"")
  property(name="syslogfacility-text" format="jsonf")
  constant(value="\",\"program\":\"")
  property(name="programname" format="jsonf")
  constant(value="\",\"pid\":\"")
  property(name="procid" format="jsonf")
  constant(value="\",\"message\":\"")
  property(name="msg" format="jsonf")
  constant(value="\"}\n")
}

# Write to shared volume file
*.* action(type="omfile"
  file="/data/logs.jsonl"
  template="JsonLines"
  fileOwner="root"
  fileGroup="root"
  fileCreateMode="0644"
  dirCreateMode="0755"
)