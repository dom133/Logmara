# Syslog receiver configuration
# High-throughput: write JSON lines to shared file

# Load input modules
$ModLoad imtcp
$ModLoad imudp

# Enable TCP and UDP listeners
$InputTCPServerRun 514
$UDPServerRun 514

# JSON template - list type with matching field names for Go parser
template(name="JsonLines" type="list") {
  constant(value="{")
  constant(value="\"timestamp\":\"")
  property(name="timereported" dateFormat="rfc3339")
  constant(value="\",\"hostname\":\"")
  property(name="hostname")
  constant(value="\",\"severity\":\"")
  property(name="syslogseverity-text")
  constant(value="\",\"facility\":\"")
  property(name="syslogfacility-text")
  constant(value="\",\"app_name\":\"")
  property(name="programname")
  constant(value="\",\"process_id\":\"")
  property(name="procid")
  constant(value="\",\"message\":\"")
  property(name="msg")
  constant(value="\"}\n")
}

# Write to shared volume file
*.* action(type="omfile"
  file="/data/logs.jsonl"
  template="JsonLines"
  fileOwner="root"
  fileGroup="root"
  fileCreateMode="0644"
  dirCreateMode="0755"
)