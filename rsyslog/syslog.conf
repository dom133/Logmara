# Syslog receiver configuration
# High-throughput: write JSON lines to shared file

# Load input modules
$ModLoad imtcp
$ModLoad imudp

# Enable TCP and UDP listeners
$InputTCPServerRun 514
$UDPServerRun 514

# JSON template - list type with format="2" for JSON escaping
template(name="JsonLines" type="list") {
  constant(value="{")
  constant(value="\"timestamp\":\"")
  property(name="timereported" dateFormat="rfc3339" format="2")
  constant(value="\",\"hostname\":\"")
  property(name="hostname" format="2")
  constant(value="\",\"severity\":\"")
  property(name="syslogseverity-text" format="2")
  constant(value="\",\"facility\":\"")
  property(name="syslogfacility-text" format="2")
  constant(value="\",\"app_name\":\"")
  property(name="programname" format="2")
  constant(value="\",\"process_id\":\"")
  property(name="procid" format="2")
  constant(value="\",\"message\":\"")
  property(name="msg" format="2")
  constant(value="\"}\n")
}

# Write to shared volume file
*.* action(type="omfile"
  file="/data/logs.jsonl"
  template="JsonLines"
  fileOwner="root"
  fileGroup="root"
  fileCreateMode="0644"
  dirCreateMode="0755"
)