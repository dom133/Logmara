# Syslog receiver configuration
# High-throughput: write JSON lines to shared file

# Load input modules
$ModLoad imtcp
$ModLoad imudp

# Cap the size of a single accepted message at the tailer's per-line
# processing limit (maxLineSize in backend/tailer/tailer.go - keep these
# two in sync). Without this, a device (or a spoofed sender) could push a
# single oversized/malformed message that - since all hosts' logs share one
# sequentially-processed file - risks stalling ingestion for everyone until
# that record is worked past.
$MaxMessageSize 10485760

# Enable TCP and UDP listeners
$InputTCPServerRun 514
$UDPServerRun 514

# JSON template - format="json" escapes values per JSON spec
template(name="JsonLines" type="list") {
  constant(value="{")
  constant(value="\"timestamp\":\"")
  # timegenerated (this server's own receipt clock) instead of timereported
  # (parsed from the device's message body): most devices send legacy
  # RFC3164 timestamps with no timezone offset, which rsyslog would
  # otherwise fill in using ITS OWN local time - wrong if this container's
  # clock isn't in the same zone as the device (see docker-compose.yml's
  # TZ). timegenerated is stamped at receipt from the system clock, which
  # is always a correct UTC instant regardless of the container's
  # configured timezone.
  property(name="timegenerated" dateFormat="rfc3339" format="json")
  constant(value="\",\"hostname\":\"")
  property(name="hostname" format="json")
  constant(value="\",\"fromhost_ip\":\"")
  property(name="fromhost-ip" format="json")
  constant(value="\",\"severity\":\"")
  property(name="syslogseverity-text" format="json")
  constant(value="\",\"facility\":\"")
  property(name="syslogfacility-text" format="json")
  constant(value="\",\"app_name\":\"")
  property(name="programname" format="json")
  constant(value="\",\"process_id\":\"")
  property(name="procid" format="json")
  constant(value="\",\"message\":\"")
  property(name="msg" format="json")
  constant(value="\"}\n")
}

# Write to shared volume file
# reopenOnResize: rsyslog reopens file when size changes (needed for tailer compaction)
# Note: reopenOnResize parameter is not supported in rsyslog 8.2302.0+ so it's been removed
*.* action(type="omfile"
  file="/data/logs.jsonl"
  template="JsonLines"
  fileOwner="root"
  fileGroup="root"
  fileCreateMode="0644"
  dirCreateMode="0755"
)

# --- Optional: mTLS relay ingestion (multi-VLAN deployments) --------------
# Lets one or more small "syslog relay" hosts deployed in other VLANs
# forward already-JSON-formatted syslog to this server over an
# authenticated, encrypted channel, while this server keeps accepting
# direct syslog on 514 from its own VLAN exactly as above. See README
# "Syslog Relay".
#
# TLS material under /data/relay is managed by the API (Admin > Settings to
# enable relay ingestion, then Admin > Syslog Relay to issue certs - see
# backend/relaypki and backend/handler/relay.go). entrypoint.sh generates a
# placeholder CA/server cert here if the API hasn't yet, so this listener
# can always start even when the feature has never been turned on; actual
# access is gated by allowed-relays.conf below, which defaults to "stop"
# (drop everything) until an admin whitelists a relay IP.
global(
  DefaultNetstreamDriverCAFile="/data/relay/ca.crt"
  DefaultNetstreamDriverCertFile="/data/relay/server.crt"
  DefaultNetstreamDriverKeyFile="/data/relay/server.key"
)

# --- Optional: direct TLS ingestion, no client certificate required -------
# Plain syslog senders (not going through a relay) that want an encrypted
# transport instead of unauthenticated 514/tcp can point at 6514/tcp
# instead - same ingestion as 514 above (goes through the default ruleset,
# so it's written to logs.jsonl via the JsonLines template near the top of
# this file), just wrapped in server-side TLS. AuthMode="anon" means the
# server presents a certificate (reusing the same
# DefaultNetstreamDriverCertFile/KeyFile set above) but does not require or
# check one from the client - unlike the
# mTLS relay listener on 6515 below, this port is not gated by the relay
# whitelist/ACL, so leave it unpublished (or firewalled) if it isn't
# wanted. Devices that don't validate the server certificate chain (most
# don't, and the placeholder cert generated before relay ingestion has ever
# been configured is self-signed anyway) can use this port freely.
input(type="imtcp" port="6514"
  StreamDriver.Name="gtls"
  StreamDriver.Mode="1"
  StreamDriver.AuthMode="anon"
)

# RelayPassthrough: a relayed message already arrives as a fully-rendered
# JsonLines JSON object - the relay applies that same template (see
# backend/handler/relay.go's relayConfSnippet) before forwarding it as its
# own message body. Re-applying JsonLines here (as relayAccept used to)
# reconstructs hostname/fromhost-ip from THIS hop instead - the relay's own
# identity, not the original device - and double-encodes the message as an
# escaped nested JSON string. Write the incoming msg through verbatim
# instead, so the original device's fields survive the extra hop.
template(name="RelayPassthrough" type="string" string="%msg%\n")

# RelayHeartbeat*: liveness for the Admin > Health "Syslog Relay Liveness"
# tab (see handler.fetchRelayHealth) can't reach into the relay host at all
# (separate untrusted VLAN, outbound-only) and used to piggyback on
# mv_device_stats.last_seen for the relay's own whitelisted IP - which only
# worked because of the RelayPassthrough bug above: every relayed message
# used to carry the relay's IP as fromhost_ip, not the original device's.
# Now that's fixed, so track it independently here instead, keyed off
# fromhost-ip - the actual mTLS peer for this hop, unaffected by whatever
# the forwarded JSON payload itself says - one small file per relay IP,
# touched on every batch it sends. handler.relayHeartbeatLastSeen reads
# these files' mtimes back on the shared /data volume.
template(name="RelayHeartbeatFile" type="string" string="/data/relay/heartbeat-%fromhost-ip%")
template(name="RelayHeartbeatContent" type="string" string="%timegenerated:::date-rfc3339%\n")

ruleset(name="relayAccept") {
  action(type="omfile"
    dynaFile="RelayHeartbeatFile"
    dynaFileCacheSize="10"
    template="RelayHeartbeatContent"
  )
  action(type="omfile"
    file="/data/logs.jsonl"
    template="RelayPassthrough"
    fileOwner="root"
    fileGroup="root"
    fileCreateMode="0644"
    dirCreateMode="0755"
  )
}

# Regenerated in full by the API on every whitelist/settings change (see
# handler.writeRelayACL) - both ruleset(name="relayIngest") AND the
# input() listener on port 6515 itself live in this included file now, not
# just the IP allow-list: pinning the mTLS handshake to each relay's exact
# currently-issued certificate (StreamDriver.AuthMode="x509/name" +
# PermittedPeer, matched against the CommonName relaypki.IssueClientCert
# gives it) requires PermittedPeer to be regenerated alongside the ACL,
# and that parameter can only be set where the listener itself is declared.
# mode="optional" so a first boot before the API has ever run still starts
# cleanly - entrypoint.sh seeds an equivalent fail-closed version of this
# file for that window. Applying a change here needs a real rsyslogd
# restart, not just SIGHUP (see entrypoint.sh's supervisor loop and
# reload-sidecar/cgi-bin/reload.sh).
include(file="/data/relay/allowed-relays.conf" mode="optional")