# Syslog receiver configuration
# High-throughput: write JSON lines to shared file

# Load input modules
$ModLoad imtcp
$ModLoad imudp

# Enable TCP and UDP listeners
$InputTCPServerRun 514
$UDPServerRun 514

# JSON template - format="json" escapes values per JSON spec
template(name="JsonLines" type="list") {
  constant(value="{")
  constant(value="\"timestamp\":\"")
  property(name="timereported" dateFormat="rfc3339" format="json")
  constant(value="\",\"hostname\":\"")
  property(name="hostname" format="json")
  constant(value="\",\"fromhost_ip\":\"")
  property(name="fromhost-ip" format="json")
  constant(value="\",\"severity\":\"")
  property(name="syslogseverity-text" format="json")
  constant(value="\",\"facility\":\"")
  property(name="syslogfacility-text" format="json")
  constant(value="\",\"app_name\":\"")
  property(name="programname" format="json")
  constant(value="\",\"process_id\":\"")
  property(name="procid" format="json")
  constant(value="\",\"message\":\"")
  property(name="msg" format="json")
  constant(value="\"}\n")
}

# Write to shared volume file
# reopenOnResize: rsyslog reopens file when size changes (needed for tailer compaction)
# Note: reopenOnResize parameter is not supported in rsyslog 8.2302.0+ so it's been removed
*.* action(type="omfile"
  file="/data/logs.jsonl"
  template="JsonLines"
  fileOwner="root"
  fileGroup="root"
  fileCreateMode="0644"
  dirCreateMode="0755"
)