# Syslog receiver configuration
# High-throughput: write JSON lines to shared file

# Load input modules
$ModLoad imtcp
$ModLoad imudp

# Enable TCP and UDP listeners
$InputTCPServerRun 514
$UDPServerRun 514

# Write to shared volume file using built-in EF-JSON template
*.* action(type="omfile"
  file="/data/logs.jsonl"
  template="RSYSLOG_EF-JSON"
  fileOwner="root"
  fileGroup="root"
  fileCreateMode="0644"
  dirCreateMode="0755"
)