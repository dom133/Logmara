# HAProxy in front of the Patroni-managed Postgres cluster (docker-stack.postgres.yml).
# Health-checks each node's Patroni REST API (port 8008) so writes only ever
# land on the current leader; failover is fully automatic once Patroni
# promotes a new leader after the old one disappears.
#
# Loaded into the stack as a Swarm config:
#   docker config create haproxy_pg_cfg haproxy/haproxy.cfg

global
    maxconn 200
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    retries 3
    timeout connect 4s
    timeout client  30m
    timeout server  30m

# Docker's embedded DNS (127.0.0.11) re-resolves service names as overlay-
# network IPs change on restart/reschedule. Without this, HAProxy resolves
# `server` addresses once at startup and refuses to start ("Failed to
# initialize server(s) addr") if a postgres node's task isn't up yet.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

# Postgres clients (the api service's DATABASE_URL) connect here on 5000.
# Only the node whose Patroni /primary check returns 200 is forwarded to.
listen postgres_primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgres1 postgres1:5432 check port 8008 resolvers docker init-addr none
    server postgres2 postgres2:5432 check port 8008 resolvers docker init-addr none
    server postgres3 postgres3:5432 check port 8008 resolvers docker init-addr none

# Optional read-only endpoint spreading SELECTs across replicas (and the
# leader as a fallback). Point read-heavy/report queries at :5001 if desired;
# the api service does not use this today.
listen postgres_replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgres1 postgres1:5432 check port 8008 resolvers docker init-addr none
    server postgres2 postgres2:5432 check port 8008 resolvers docker init-addr none
    server postgres3 postgres3:5432 check port 8008 resolvers docker init-addr none

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
