# HAProxy in front of the RabbitMQ cluster (docker-stack.rabbitmq.yml).
# Round-robins AMQP traffic across rabbitmq1/2/3. RabbitMQ clustering
# handles mirrored queues and failover transparently.
#
# Loaded into the stack as a Swarm config:
#   docker config create haproxy_rabbitmq_cfg haproxy/haproxy-rabbitmq.cfg

global
    maxconn 400
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    retries 3
    timeout connect 4s
    timeout client  30m
    timeout server  30m

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

listen rabbitmq
    bind *:5672
    balance roundrobin
    option tcp-check
    default-server inter 5s fall 3 rise 2 on-marked-down shutdown-sessions
    server rabbitmq1 rabbitmq1:5672 check resolvers docker init-addr none
    server rabbitmq2 rabbitmq2:5672 check resolvers docker init-addr none
    server rabbitmq3 rabbitmq3:5672 check resolvers docker init-addr none

# RabbitMQ management web UI (15672). Session state is per-node, so
# proxy to a single node only (management plugin connects to the full
# cluster internally, so this is fine).
listen rabbitmq_management
    bind *:15672
    mode http
    server rabbitmq1 rabbitmq1:15672 check resolvers docker init-addr none

listen stats
    bind *:7002
    mode http
    stats enable
    stats uri /
    stats refresh 5s
