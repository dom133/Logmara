# HAProxy in front of the app tier (frontend/api) for Docker Swarm HA
# (docker-stack.app.yml). Runs on every edge=true node behind the keepalived
# VIP - same "mode: global, only the VIP holder gets external traffic"
# pattern already used for rsyslog, except here HAProxy fans out to every
# frontend/api replica across the whole app=true fleet, giving real load
# balancing (not just failover) behind a single external endpoint.
#
# frontend itself is NOT published on the host anymore (see docker-
# stack.app.yml) - this is what actually receives :80/:443 now.
#
# Loaded into the stack as a Swarm config:
#   docker config create haproxy_app_cfg haproxy/haproxy-app.cfg
# (or scripts/swarm-bootstrap.sh haproxy-app-config)

global
    maxconn 4096
    log stdout format raw local0

defaults
    log     global
    retries 3
    timeout connect 4s
    timeout client  30m
    timeout server  30m

# Docker's embedded DNS (127.0.0.11) re-resolves service names as overlay-
# network IPs change on restart/reschedule/scale. See the matching comment
# in haproxy.cfg for why this is required.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

# Browser/API clients connect here on 80. server-template pre-allocates 10
# slots and fills them from tasks.frontend's A records (one per running
# frontend task) - raise the "10" if you ever run more than 10 frontend
# replicas. Unused slots are simply left DOWN, which is expected/harmless.
listen frontend_http
    bind *:80
    mode http
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr none
    server-template frontend- 10 tasks.frontend:80 check

# TLS pass-through: nginx inside the frontend container terminates HTTPS
# itself (see frontend/nginx.conf's https.conf, admin-managed) - HAProxy
# only load-balances the TCP connection, it never sees the certificate.
# Health is checked against the plain :80 listener instead of :443 because
# HTTPS is disabled by default and this must still gate the server in/out
# of rotation.
listen frontend_https
    bind *:443
    mode tcp
    balance roundrobin
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr none
    server-template frontend- 10 tasks.frontend:443 check port 80

# No direct API listener here on purpose - :8080 is not published to the
# host. All API traffic goes through frontend_http/frontend_https above and
# nginx's own /api/ proxy_pass (which load-balances across api replicas via
# Swarm's internal service VIP), so nginx is the only path in.

# Separate port from haproxy.cfg's :7000 stats page (that one's for the
# Postgres HAProxy, which can run on the same edge/app nodes).
listen stats
    bind *:7001
    mode http
    stats enable
    stats uri /
    stats refresh 5s
