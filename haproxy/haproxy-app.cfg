# HAProxy in front of the app tier (frontend/api) for Docker Swarm HA
# (docker-stack.app.yml). Runs on every edge=true node behind the keepalived
# VIP - same "mode: global, only the VIP holder gets external traffic"
# pattern already used for rsyslog, except here HAProxy fans out to every
# frontend/api replica across the whole app=true fleet, giving real load
# balancing (not just failover) behind a single external endpoint.
#
# frontend itself is NOT published on the host anymore (see docker-
# stack.app.yml) - this is what actually receives :80/:443 now.
#
# Loaded into the stack as a Swarm config:
#   docker config create haproxy_app_cfg haproxy/haproxy-app.cfg
# (or scripts/swarm-bootstrap.sh haproxy-app-config)

global
    maxconn 4096
    log stdout format raw local0

defaults
    log     global
    retries 3
    timeout connect 4s
    timeout client  30m
    timeout server  30m

# Docker's embedded DNS (127.0.0.11) re-resolves service names as overlay-
# network IPs change on restart/reschedule/scale. See the matching comment
# in haproxy.cfg for why this is required.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s

# Browser/API clients connect here on 80. server-template pre-allocates 10
# slots and fills them from tasks.frontend's A records (one per running
# frontend task) - raise the "10" if you ever run more than 10 frontend
# replicas. Unused slots are simply left DOWN, which is expected/harmless.
#
# Tried tying this to ${FRONTEND_REPLICAS} instead (HAProxy does support
# env-var substitution in config files) - but it does NOT apply to
# server-template's count/range argument specifically: HAProxy rejects it
# at parse time ("bad server-template number or range arg"), refusing to
# start at all. Do not reintroduce that without confirming HAProxy actually
# accepts it there (test with `haproxy -c -f haproxy-app.cfg` against a
# throwaway container first - do not find out via a live Swarm config
# update again).
listen frontend_http
    bind *:80
    mode http
    balance roundrobin
    # This is the first hop from the public internet - without forwardfor,
    # the frontend (nginx) container sees HAProxy's own overlay-network IP
    # as $remote_addr instead of the real client, so X-Real-IP/X-Forwarded-
    # For (and everything downstream that trusts them: audit log IPs, admin
    # API key IP allowlists, etc.) end up recording the wrong address for
    # every request in this HA topology. Appends rather than replaces, same
    # as nginx's $proxy_add_x_forwarded_for - a spoofed X-Forwarded-For from
    # the client just ends up left of the truthful entry HAProxy adds, and
    # backend/main.go's defaultTrustedProxies walk (right-to-left, stopping
    # at the first untrusted hop) already ignores everything left of that.
    option forwardfor
    option httpchk GET /
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr none
    server-template frontend- 10 tasks.frontend:80 check
    # Debug aid: which frontend/edge task served this request. Note this is
    # the frontend node only, not the api replica that ends up handling
    # /api/ traffic - that goes through the api_http listener below, and the
    # api service stamps its own X-Api-Server response header for that (see
    # backend/middleware/serveridentity.go).
    http-response set-header X-Served-By %s

# TLS pass-through: nginx inside the frontend container terminates HTTPS
# itself (see frontend/nginx.conf's https.conf, admin-managed) - HAProxy
# only load-balances the TCP connection, it never sees the certificate, so
# it can't rewrite HTTP headers the way frontend_http does with forwardfor.
# send-proxy instead prepends a PROXY protocol v1 header ahead of the TLS
# bytes, conveying the real client IP that way - nginx must be told to
# expect it (NGINX_PROXY_PROTOCOL=true, see backend/handler/admin.go's
# httpsServerBlock and the api service's environment in
# docker-stack.app.yml), or the handshake breaks. Health is checked against
# the plain :80 listener instead of :443 because HTTPS is disabled by
# default and this must still gate the server in/out of rotation - that
# check is a plain TCP connect with no "check-send-proxy", so it never gets
# a PROXY header even though send-proxy is set below.
listen frontend_https
    bind *:443
    mode tcp
    balance roundrobin
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr none send-proxy
    server-template frontend- 10 tasks.frontend:443 check port 80

# Internal-only (not published to the host, no "mode: host" port mapping in
# docker-stack.app.yml) - nginx's /api/ and /api/notifications/stream
# proxy_pass hit this instead of api:8080 directly, so API traffic gets the
# same health-checked, explicit load balancing as frontend_http above
# instead of Swarm's opaque VIP round-robin. Reachable from any container on
# syslog_net as haproxy-app:8090 (haproxy-app's own Swarm-assigned VIP fans
# a connection out to whichever edge node picks it up, which then load-
# balances across every api task). Pre-allocates 10 slots, same caveat as
# frontend_http above about why this isn't ${API_REPLICAS} - raise the "10"
# by hand if you ever run more than 10 api replicas.
listen api_http
    bind *:8090
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr none
    server-template api- 10 tasks.api:8080 check

# Separate port from haproxy.cfg's :7000 stats page (that one's for the
# Postgres HAProxy, which can run on the same edge/app nodes).
listen stats
    bind *:7001
    mode http
    stats enable
    stats uri /
    stats refresh 5s
