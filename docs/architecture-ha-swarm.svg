<svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <!-- Clients / senders -->
  <rect x="250" y="18" width="220" height="54" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="360" y="40" text-anchor="middle" font-size="13.5" font-weight="600" fill="#312e81">Client (browser)</text>
  <text x="360" y="57" text-anchor="middle" font-size="11" fill="#4338ca">HTTP/HTTPS 80/443</text>

  <rect x="650" y="18" width="220" height="54" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="760" y="40" text-anchor="middle" font-size="13.5" font-weight="600" fill="#7c2d12">Devices / senders</text>
  <text x="760" y="57" text-anchor="middle" font-size="11" fill="#9a3412">syslog tcp/udp 514</text>

  <!-- Floating VIP -->
  <rect x="360" y="104" width="400" height="56" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="560" y="126" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5b21b6">Floating VIP (keepalived) — 10.0.0.100</text>
  <text x="560" y="143" text-anchor="middle" font-size="11" fill="#6d28d9">follows whichever edge node currently holds it</text>

  <line x1="360" y1="72" x2="452" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="72" x2="668" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="452" y1="160" x2="300" y2="222" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDash)"/>
  <text x="330" y="192" font-size="10.5" fill="#6d28d9">VRRP</text>
  <line x1="668" y1="160" x2="820" y2="222" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDash)"/>
  <text x="720" y="192" font-size="10.5" fill="#6d28d9">VRRP</text>

  <!-- App / Edge tier group -->
  <rect x="40" y="185" width="1040" height="235" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="56" y="206" font-size="12.5" font-weight="600" fill="#334155">App / Edge tier — Swarm workers (app=true, edge=true)</text>

  <!-- app1 -->
  <rect x="70" y="222" width="460" height="176" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="90" y="246" font-size="14" font-weight="700" fill="#0c4a6e">app1 — MASTER</text>

  <rect x="86" y="258" width="130" height="30" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="151" y="278" text-anchor="middle" font-size="11" fill="#5b21b6">keepalived</text>
  <rect x="226" y="258" width="140" height="30" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="296" y="278" text-anchor="middle" font-size="11" fill="#1e293b">haproxy-app :80/:443</text>
  <rect x="376" y="258" width="140" height="30" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="446" y="278" text-anchor="middle" font-size="11" fill="#164e63">frontend</text>

  <rect x="86" y="300" width="150" height="30" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="161" y="320" text-anchor="middle" font-size="11" fill="#1e3a8a">api (nginx + Go)</text>
  <rect x="246" y="300" width="120" height="30" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="306" y="320" text-anchor="middle" font-size="11" fill="#713f12">rsyslog :514</text>

  <text x="90" y="380" font-size="10.5" fill="#0c4a6e">rsyslog mode: global (VIP-holder only receives 514/6514/6515 traffic)</text>

  <!-- app2 -->
  <rect x="590" y="222" width="460" height="176" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="610" y="246" font-size="14" font-weight="700" fill="#0c4a6e">app2 — BACKUP</text>

  <rect x="606" y="258" width="130" height="30" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="671" y="278" text-anchor="middle" font-size="11" fill="#5b21b6">keepalived</text>
  <rect x="746" y="258" width="140" height="30" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="816" y="278" text-anchor="middle" font-size="11" fill="#1e293b">haproxy-app :80/:443</text>
  <rect x="896" y="258" width="140" height="30" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="966" y="278" text-anchor="middle" font-size="11" fill="#164e63">frontend</text>

  <rect x="606" y="300" width="150" height="30" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="681" y="320" text-anchor="middle" font-size="11" fill="#1e3a8a">api (nginx + Go)</text>
  <rect x="766" y="300" width="120" height="30" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="826" y="320" text-anchor="middle" font-size="11" fill="#713f12">rsyslog :514</text>

  <text x="610" y="380" font-size="10.5" fill="#0c4a6e">extra app=true/edge=true nodes scale this tier further</text>

  <!-- App tier -> Data tier / NFS -->
  <path d="M300 398 C 300 440, 330 440, 380 462" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M820 398 C 900 440, 940 470, 940 528" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="900" y="450" font-size="10.5" fill="#334155">NFS mount</text>
  <text x="900" y="463" font-size="10.5" fill="#334155">(/data)</text>

  <!-- Data tier group -->
  <rect x="40" y="432" width="700" height="278" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="56" y="453" font-size="12.5" font-weight="600" fill="#334155">Data tier — Swarm managers (pg1–pg3)</text>

  <rect x="250" y="462" width="260" height="50" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="380" y="481" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">HAProxy :5000</text>
  <text x="380" y="497" text-anchor="middle" font-size="10.5" fill="#334155">routes writes → current Patroni leader</text>
  <line x1="380" y1="512" x2="380" y2="530" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- pg1 -->
  <rect x="66" y="530" width="196" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="86" y="552" font-size="13" font-weight="700" fill="#14532d">pg1</text>
  <text x="235" y="552" text-anchor="end" font-size="10.5" font-weight="600" fill="#166534">● leader</text>
  <rect x="80" y="562" width="168" height="24" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="164" y="578" text-anchor="middle" font-size="10.5" fill="#14532d">Patroni + Postgres</text>
  <rect x="80" y="590" width="168" height="24" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="164" y="606" text-anchor="middle" font-size="10.5" fill="#5b21b6">etcd</text>
  <rect x="80" y="618" width="168" height="24" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="164" y="634" text-anchor="middle" font-size="10.5" fill="#991b1b">Redis</text>
  <rect x="80" y="646" width="168" height="24" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
  <text x="164" y="662" text-anchor="middle" font-size="10.5" fill="#9f1239">Sentinel</text>

  <!-- pg2 -->
  <rect x="272" y="530" width="196" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="292" y="552" font-size="13" font-weight="700" fill="#14532d">pg2</text>
  <rect x="286" y="562" width="168" height="24" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="370" y="578" text-anchor="middle" font-size="10.5" fill="#14532d">Patroni + Postgres</text>
  <rect x="286" y="590" width="168" height="24" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="370" y="606" text-anchor="middle" font-size="10.5" fill="#5b21b6">etcd</text>
  <rect x="286" y="618" width="168" height="24" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="370" y="634" text-anchor="middle" font-size="10.5" fill="#991b1b">Redis</text>
  <rect x="286" y="646" width="168" height="24" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
  <text x="370" y="662" text-anchor="middle" font-size="10.5" fill="#9f1239">Sentinel</text>

  <!-- pg3 -->
  <rect x="478" y="530" width="196" height="160" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="498" y="552" font-size="13" font-weight="700" fill="#14532d">pg3</text>
  <rect x="492" y="562" width="168" height="24" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="576" y="578" text-anchor="middle" font-size="10.5" fill="#14532d">Patroni + Postgres</text>
  <rect x="492" y="590" width="168" height="24" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="576" y="606" text-anchor="middle" font-size="10.5" fill="#5b21b6">etcd</text>
  <rect x="492" y="618" width="168" height="24" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="576" y="634" text-anchor="middle" font-size="10.5" fill="#991b1b">Redis</text>
  <rect x="492" y="646" width="168" height="24" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
  <text x="576" y="662" text-anchor="middle" font-size="10.5" fill="#9f1239">Sentinel</text>

  <text x="66" y="704" font-size="10.5" fill="#334155">leader elected by Patroni (via etcd DCS) — can be any of pg1–pg3, re-elected automatically on failure</text>

  <!-- NFS -->
  <rect x="780" y="530" width="300" height="160" rx="12" fill="#fafaf9" stroke="#78716c" stroke-width="2"/>
  <text x="800" y="554" font-size="13.5" font-weight="700" fill="#292524">nfs1 — NFS server</text>
  <text x="800" y="574" font-size="11" fill="#57534e">(outside the Swarm cluster)</text>
  <rect x="796" y="590" width="268" height="26" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.2"/>
  <text x="930" y="607" text-anchor="middle" font-size="10.5" fill="#44403c">log_data</text>
  <rect x="796" y="622" width="268" height="26" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.2"/>
  <text x="930" y="639" text-anchor="middle" font-size="10.5" fill="#44403c">log_spool</text>
  <rect x="796" y="654" width="268" height="26" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.2"/>
  <text x="930" y="671" text-anchor="middle" font-size="10.5" fill="#44403c">parser_defs</text>

  <!-- Footer -->
  <text x="40" y="740" font-size="11.5" fill="#475569">6-node example (pg1–pg3 + app1–app2 + nfs1). Any tier scales by adding more nodes with the matching Swarm label.</text>
  <text x="40" y="758" font-size="11.5" fill="#475569">See docker-stack.postgres.yml / docker-stack.redis.yml / docker-stack.app.yml for full service definitions.</text>
  <text x="40" y="776" font-size="11.5" fill="#475569">Optional: nfs1 can itself be made HA with a DRBD-replicated nfs2 + keepalived VIP — see "Optional: NFS Replica".</text>
</svg>
