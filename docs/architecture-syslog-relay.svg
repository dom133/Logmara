<svg viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="480" fill="#ffffff"/>

  <!-- VLAN A: devices -->
  <rect x="16" y="16" width="220" height="200" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="30" y="38" font-size="12.5" font-weight="600" fill="#9a3412">VLAN A (devices)</text>

  <rect x="40" y="54" width="150" height="38" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="115" y="78" text-anchor="middle" font-size="12.5" fill="#7c2d12">device1</text>
  <rect x="40" y="102" width="150" height="38" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="115" y="126" text-anchor="middle" font-size="12.5" fill="#7c2d12">device2</text>
  <rect x="40" y="150" width="150" height="38" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="115" y="174" text-anchor="middle" font-size="12.5" fill="#7c2d12">device3</text>

  <!-- VLAN B: relay -->
  <rect x="256" y="16" width="220" height="200" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="270" y="38" font-size="12.5" font-weight="600" fill="#3730a3">VLAN B (DMZ / relay)</text>
  <rect x="286" y="92" width="160" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="366" y="116" text-anchor="middle" font-size="13.5" font-weight="600" fill="#312e81">syslog-relay</text>
  <text x="366" y="133" text-anchor="middle" font-size="10.5" fill="#4338ca">small server, forward-only</text>

  <!-- device1-3 -> relay -->
  <path d="M190 73 L 286 111" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M190 121 L 286 121" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M190 169 L 286 131" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- VLAN D: second relay -->
  <rect x="16" y="240" width="460" height="120" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="30" y="262" font-size="12.5" font-weight="600" fill="#6b21a8">VLAN D (DMZ / relay 2)</text>
  <rect x="40" y="284" width="150" height="38" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
  <text x="115" y="308" text-anchor="middle" font-size="12.5" fill="#581c87">device4</text>
  <rect x="286" y="278" width="170" height="50" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="371" y="298" text-anchor="middle" font-size="13.5" font-weight="600" fill="#581c87">syslog-relay-2</text>
  <text x="371" y="314" text-anchor="middle" font-size="10.5" fill="#6b21a8">forward-only</text>
  <path d="M190 303 L 286 303" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- VLAN C: central -->
  <rect x="700" y="16" width="264" height="344" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="714" y="38" font-size="12.5" font-weight="600" fill="#155e75">VLAN C (central server)</text>

  <rect x="726" y="70" width="212" height="58" rx="10" fill="#cffafe" stroke="#0e7490" stroke-width="2"/>
  <text x="832" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#164e63">rsyslog</text>
  <text x="832" y="110" text-anchor="middle" font-size="10.5" fill="#155e75">mTLS listener :6514</text>

  <line x1="832" y1="128" x2="832" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="726" y="182" width="212" height="52" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="832" y="212" text-anchor="middle" font-size="13.5" font-weight="600" fill="#134e4a">logs.jsonl</text>

  <line x1="832" y1="234" x2="832" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="726" y="282" width="212" height="52" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="832" y="303" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">tailer</text>
  <text x="832" y="319" text-anchor="middle" font-size="10.5" fill="#334155">(unchanged)</text>

  <!-- relay -> rsyslog mTLS links -->
  <path d="M446 122 C 600 122, 620 99, 724 99" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="94" text-anchor="middle" font-size="11" fill="#334155">mTLS 6514/tcp</text>

  <path d="M456 303 C 620 303, 640 105, 724 105" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="345" text-anchor="middle" font-size="11" fill="#334155">mTLS 6514/tcp</text>

  <!-- footer note -->
  <text x="16" y="405" font-size="11.5" fill="#475569">The central server keeps accepting direct syslog on 514 from its own VLAN as usual — relays are additive,</text>
  <text x="16" y="422" font-size="11.5" fill="#475569">not a replacement, and any number of them can point at the same central server.</text>
</svg>
