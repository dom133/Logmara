services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB:-syslog_db}
      POSTGRES_USER: ${POSTGRES_USER:-syslog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syslogpass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syslog} -d ${POSTGRES_DB:-syslog_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - syslog_net
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rsyslog:
    build:
      context: .
      dockerfile: Dockerfile.rsyslog
    environment:
      - TZ=UTC
    volumes:
      - log_data:/data
      - log_spool:/spool
    ports:
      - "${RSYSLOG_PORT:-514}:514"
      - "${RSYSLOG_PORT:-514}:514/udp"
      # mTLS listener for remote syslog relays (Admin > Settings > enable
      # relay ingestion). Safe to leave published even when unused: with no
      # relay certificate issued and none whitelisted, every connection is
      # dropped at the ACL (see rsyslog/syslog.conf and README "Syslog Relay").
      - "${RELAY_MTLS_PORT:-6514}:6514"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - syslog_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Read-only, allow-listed view onto the local Docker Engine API, used by
  # Admin > Health (backend/handler/health_docker.go) to show container
  # status. api talks to this instead of mounting /var/run/docker.sock
  # itself - a raw socket mount grants full control of the host regardless
  # of any :ro flag on the mount, since that only restricts writes to the
  # socket *file*, not what the Docker API on the other end of it will do.
  # This proxy only forwards GET on CONTAINERS/INFO and rejects everything
  # else (POST: 0), so a bug here can't be escalated into host access.
  # Not published to the host - reachable only from other syslog_net
  # containers.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - syslog_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-key}
    environment:
      TZ: UTC
      DATABASE_URL: postgres://${POSTGRES_USER:-syslog}:${POSTGRES_PASSWORD:-syslogpass}@postgres:5432/${POSTGRES_DB:-syslog_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-key}
      PORT: "8080"
      LOG_FILE_PATH: /data/logs.jsonl
      NGINX_RELOAD_URL: http://frontend:8081/cgi-bin/reload.sh
      NGINX_CONF_DIR: /data/nginx
      # Optional: seeds the initial HTTPS settings (both default to disabled)
      # the first time the database is initialized. After that, it's managed
      # from the admin Settings UI and this env var is ignored on subsequent
      # restarts.
      HTTPS_ENABLED: ${HTTPS_ENABLED:-}
      HTTPS_REDIRECT: ${HTTPS_REDIRECT:-}
      # Optional: seeds the initial allowed CORS origin(s) for the frontend
      # (comma-separated) the first time the database is initialized. After
      # that, it's managed from the admin Settings UI and this env var is
      # ignored on subsequent restarts.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Optional: this server's hostname/IP as reachable from a relay's VLAN,
      # pre-filled into the relay.conf bundled with every certificate
      # generated under Admin > Syslog Relay. Leave unset to fill it in by
      # hand after downloading (see README "Syslog Relay").
      RELAY_CENTRAL_HOST: ${RELAY_CENTRAL_HOST:-}
      # Backs Admin > Health - see the docker-proxy service above.
      DOCKER_PROXY_URL: http://docker-proxy:2375
    volumes:
      - log_data:/data
    ports:
      # Not meant to be publicly reachable - traffic normally comes in via
      # nginx on 80/443. Fixed (not env-configurable); only published so you
      # can hit the API directly if you have a specific reason to.
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - syslog_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - log_data:/data
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - syslog_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
  log_data:
  log_spool:

networks:
  syslog_net:
    driver: bridge