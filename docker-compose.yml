services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syslog_db}
      POSTGRES_USER: ${POSTGRES_USER:-syslog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syslogpass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syslog} -d ${POSTGRES_DB:-syslog_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - syslog_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rsyslog:
    build:
      context: .
      dockerfile: Dockerfile.rsyslog
    environment:
      - TZ=${TZ:-Europe/Warsaw}
    volumes:
      - log_data:/data
      - log_spool:/spool
    ports:
      - "${RSYSLOG_PORT:-514}:514"
      - "${RSYSLOG_PORT:-514}:514/udp"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - syslog_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-key}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-syslog}:${POSTGRES_PASSWORD:-syslogpass}@postgres:5432/${POSTGRES_DB:-syslog_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-key}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: "8080"
      LOG_FILE_PATH: /data/logs.jsonl
      NGINX_RELOAD_URL: http://frontend:8081/cgi-bin/reload.sh
      NGINX_CONF_DIR: /data/nginx
    volumes:
      - log_data:/data
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - syslog_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - log_data:/data
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - syslog_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
  log_data:
  log_spool:

networks:
  syslog_net:
    driver: bridge