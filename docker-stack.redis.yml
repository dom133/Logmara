# HA Redis (Sentinel) for Docker Swarm - backs backend/sharedstate: shared
# rate limiting, cache invalidation, tailer leader election, ingestion
# pause/resume, and the slow-query log across multiple `api` replicas.
#
# OPTIONAL, additive stack. Deploy before docker-stack.app.yml (api reads
# REDIS_SENTINEL_ADDRS at startup). Not needed at all for the single-server
# docker-compose.yml path, or if you keep docker-stack.app.yml's api/
# frontend at replicas: 1 - see README "High Availability Deployment".
#
# Deliberately NOT persistent: --save "" and no AOF, no bind-mounted data
# directories. Everything Redis holds here (rate-limit counters, a cache-
# invalidation ping, the ingestion pause flag, the slow-query log) is
# disposable - losing it just means a brief reset, never data loss, since
# Postgres remains the only source of truth for anything durable. This is
# what makes it safe to skip node-local persistent volumes entirely.
#
# Prerequisites (see README "High Availability Deployment"):
#   - Docker Swarm initialized, 3 nodes labeled cache_id=1 / cache_id=2 /
#     cache_id=3 (can be the same nodes as app=true/edge=true on small
#     clusters, same as pg_id in docker-stack.postgres.yml)
#   - `docker network create -d overlay --attachable syslog_net` (already
#     done if docker-stack.postgres.yml is deployed)
#   - docker-stack.vault.yml already deployed and bootstrapped, with
#     `./scripts/vault-bootstrap.sh migrate-secrets` run (creates the
#     vault_agent_token Docker secret below). redis/entrypoint.sh and
#     redis/sentinel_entrypoint.sh fetch redis_password straight from
#     Vault's HTTP API at container start - same direct-API mechanism
#     Patroni/api use (patroni/entrypoint.sh, backend/vaultclient) - using
#     vault_agent_token only to authenticate that call, not a
#     locally-rendered file.
#
# Deploy with: ./scripts/swarm-deploy.sh redis (not a bare
# `docker stack deploy` - see "content-hash name" note on the configs:
# section below for why)

version: "3.8"

x-redis-logging: &redis-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-redis-vault-env: &redis-vault-env
  VAULT_ADDR: http://vault-1:8200

x-redis-vault-secrets: &redis-vault-secrets
  - vault_agent_token

services:
  redis1:
    image: redis:7-alpine
    hostname: redis1
    networks: [syslog_net]
    environment:
      <<: *redis-vault-env
    entrypoint: ["/docker-entrypoint-init.d/entrypoint.sh"]
    command: ["--save", "", "--appendonly", "no"]
    configs:
      - source: redis_entrypoint
        target: /docker-entrypoint-init.d/entrypoint.sh
        mode: 0755
    secrets: *redis-vault-secrets
    logging: *redis-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.labels.cache_id == 1]

  redis2:
    image: redis:7-alpine
    hostname: redis2
    networks: [syslog_net]
    environment:
      <<: *redis-vault-env
    entrypoint: ["/docker-entrypoint-init.d/entrypoint.sh"]
    command: ["--replicaof", "redis1", "6379", "--save", "", "--appendonly", "no"]
    configs:
      - source: redis_entrypoint
        target: /docker-entrypoint-init.d/entrypoint.sh
        mode: 0755
    secrets: *redis-vault-secrets
    depends_on: [redis1]
    logging: *redis-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.labels.cache_id == 2]

  redis3:
    image: redis:7-alpine
    hostname: redis3
    networks: [syslog_net]
    environment:
      <<: *redis-vault-env
    entrypoint: ["/docker-entrypoint-init.d/entrypoint.sh"]
    command: ["--replicaof", "redis1", "6379", "--save", "", "--appendonly", "no"]
    configs:
      - source: redis_entrypoint
        target: /docker-entrypoint-init.d/entrypoint.sh
        mode: 0755
    secrets: *redis-vault-secrets
    depends_on: [redis1]
    logging: *redis-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.labels.cache_id == 3]

  sentinel1:
    image: redis:7-alpine
    hostname: sentinel1
    networks: [syslog_net]
    environment:
      <<: *redis-vault-env
    entrypoint: ["/docker-entrypoint-init.d/sentinel_entrypoint.sh"]
    configs:
      - source: redis_sentinel_cfg
        target: /etc/sentinel-template/sentinel.conf
      - source: redis_sentinel_entrypoint
        target: /docker-entrypoint-init.d/sentinel_entrypoint.sh
        mode: 0755
    secrets: *redis-vault-secrets
    depends_on: [redis1, redis2, redis3]
    logging: *redis-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.labels.cache_id == 1]

  sentinel2:
    image: redis:7-alpine
    hostname: sentinel2
    networks: [syslog_net]
    environment:
      <<: *redis-vault-env
    entrypoint: ["/docker-entrypoint-init.d/sentinel_entrypoint.sh"]
    configs:
      - source: redis_sentinel_cfg
        target: /etc/sentinel-template/sentinel.conf
      - source: redis_sentinel_entrypoint
        target: /docker-entrypoint-init.d/sentinel_entrypoint.sh
        mode: 0755
    secrets: *redis-vault-secrets
    depends_on: [redis1, redis2, redis3]
    logging: *redis-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.labels.cache_id == 2]

  sentinel3:
    image: redis:7-alpine
    hostname: sentinel3
    networks: [syslog_net]
    environment:
      <<: *redis-vault-env
    entrypoint: ["/docker-entrypoint-init.d/sentinel_entrypoint.sh"]
    configs:
      - source: redis_sentinel_cfg
        target: /etc/sentinel-template/sentinel.conf
      - source: redis_sentinel_entrypoint
        target: /docker-entrypoint-init.d/sentinel_entrypoint.sh
        mode: 0755
    secrets: *redis-vault-secrets
    depends_on: [redis1, redis2, redis3]
    logging: *redis-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.labels.cache_id == 3]

networks:
  syslog_net:
    external: true

secrets:
  # Same bootstrap token Patroni/api/RabbitMQ use (created by
  # `scripts/vault-bootstrap.sh migrate-secrets`) - only used to authenticate
  # redis/entrypoint.sh's and redis/sentinel_entrypoint.sh's direct Vault API
  # calls, never written to disk as the actual password.
  vault_agent_token:
    external: true

configs:
  redis_sentinel_cfg:
    file: redis/sentinel.conf.tpl
    name: redis_sentinel_cfg_${REDIS_SENTINEL_CFG_HASH:-unset}
  redis_entrypoint:
    file: redis/entrypoint.sh
    name: redis_entrypoint_${REDIS_ENTRYPOINT_HASH:-unset}
  redis_sentinel_entrypoint:
    file: redis/sentinel_entrypoint.sh
    name: redis_sentinel_entrypoint_${REDIS_SENTINEL_ENTRYPOINT_HASH:-unset}
