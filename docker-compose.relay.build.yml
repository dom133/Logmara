# Builds the relay image from source instead of pulling the pre-built one
# from Docker Hub (see docker-compose.relay.yml). Use this file when you need
# to deploy local changes to the relay, or anything not yet published under
# dom133/logmara-rsyslog-relay on Docker Hub - requires the full repo
# (source + Dockerfile.rsyslog-relay), not just this file.
#
# Deploy:
#   1. On the central server, Admin > Settings > enable "Enable Syslog Relay Ingestion".
#   2. Admin > Syslog Relay > Certyfikaty: generate a certificate for this
#      relay (label + this host's IP as seen by the central server) and
#      download the resulting syslog-relay-<label>.tar.gz - the private key
#      is only ever handed out this once, so save it now.
#   3. Extract it next to this file:
#        mkdir -p relay-bundle && tar xzf syslog-relay-<label>.tar.gz -C relay-bundle
#      (produces ca.crt, client.crt, client.key, relay.conf)
#   4. docker compose -f docker-compose.relay.build.yml up -d --build
#
# See README "Syslog Relay" for the full walkthrough, including the
# firewall rule this needs (outbound 6515/tcp to the central server only).

services:
  rsyslog-relay:
    environment:
      - TZ=UTC
    build:
      context: .
      dockerfile: Dockerfile.rsyslog-relay
    volumes:
      - ./relay-bundle/relay.conf:/etc/rsyslog.d/relay.conf:ro
      - ./relay-bundle/ca.crt:/etc/syslog-relay/tls/ca.crt:ro
      - ./relay-bundle/client.crt:/etc/syslog-relay/tls/client.crt:ro
      - ./relay-bundle/client.key:/etc/syslog-relay/tls/client.key:ro
      # rsyslog's disk-assisted queue (see relay.conf's omfwd action) spools
      # here by default - persisted so a restart doesn't drop logs that were
      # buffered while the central server/link was unreachable.
      - relay_queue:/var/lib/rsyslog
      # entrypoint-relay.sh's self-signed cert for this relay's own local
      # direct-TLS listener (6514, declared inside relay.conf itself - see
      # backend/handler/relay.go's relayConfSnippet) - persisted so it
      # stays stable across restarts instead of being regenerated every time.
      - relay_tls:/etc/syslog-relay/tls-local
    ports:
      - "${RELAY_PORT:-514}:514"
      - "${RELAY_PORT:-514}:514/udp"
      # Direct TLS ingestion into this relay itself, no client certificate
      # required (the 6514 input() inside relay.conf) - devices in this
      # relay's own VLAN that want TLS instead of plain 514 can point here
      # instead. Only present if relay.conf was (re)generated after this
      # feature was added - see README "Syslog Relay" if an older
      # relay.conf needs updating. Leave unpublished if it isn't wanted.
      - "${RELAY_TLS_PORT:-6514}:6514"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  relay_queue:
  relay_tls:
